[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steelhacks-reasoning"
version = "0.1.0"
description = "Evidence-linked Nemotron reasoning module for SteelHacks XIII"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
demo = [
  "streamlit>=1.38,<2",
]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
  "types-requests>=2.32,<3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["steelhacks_reasoning"]
